    // Hamburgermenu
    const hamburger = document.getElementById('hamburger');
    const mobileMenu = document.getElementById('mobile-menu');
    let mobileMenuToggled = false;

    hamburger.addEventListener('click', function() {
        this.classList.toggle('open');

        if (mobileMenuToggled == false) {
            mobileMenu.style.transform = "translate(0%)"
        } else {
            mobileMenu.style.transform = "translate(100%)"
        }

        mobileMenuToggled = !mobileMenuToggled;
    });


    // Change navbar on scroll
    const logo = document.getElementById('logo');
    const navbar = document.getElementById('navbar-container');
    
    window.addEventListener("scroll", (event) => {
        let scroll = this.scrollY;

        toggleNavbar(scroll);
    });

    function toggleNavbar(scroll) {
        
        if (scroll >= 20) {
            logo.setAttribute('class', 'navbar__container__logo--small');
            navbar.style.marginTop = '0px';
        } else {
            logo.setAttribute('class', 'navbar__container__logo');
            navbar.style.marginTop = '25px';
        }
    }

    // Random curtain color
    const curtain = document.getElementById('curtain');

    function curtainColor() {
        let randomNumber = Math.floor(Math.random()*3+1);

        if (randomNumber == 1) {
            curtain.style.backgroundColor = '#0078D7'; //blue
        } else if (randomNumber == 2) {
            curtain.style.backgroundColor = '#FF445C' //red
        } else {
            curtain.style.backgroundColor = '#00BF72' //green
        }
    }
